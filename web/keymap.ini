# Default keyboard controls for the browser client. Players can remap them on the page
# (site/controls.js reads the Controls lines below and keeps their changes in the browser).
# build.sh also drops these keys from upstream zelda3.ini's [KeyMap] and appends the rest of
# this file, with Controls emptied: the page hands zelda3 the buttons itself.
# Key names are SDL names ("w", "Return", "Right Shift", "Up").
[KeyMap]
# Order: Up, Down, Left, Right, Select, Start, A, B, X, Y, L, R
Controls = w, s, a, d, f, g, j, m, i, l, q, e
# Backups: arrow keys still move, Right Shift / Enter still work as Select / Start
# (a second Controls line adds extra keys for the first few buttons)
Controls = Up, Down, Left, Right, Right Shift, Return

# Upstream binds cheats and debug toggles to single letters (w, o, k, l, t, f, r, p).
# Unbind them so they can't fire by accident or clash with the controls above.
CheatLife =
PauseDimmed =
CheatKeys =
CheatEquipment =
CheatWalkThroughWalls =
ClearKeyLog =
StopReplay =
ReplayTurbo =
DisplayPerf =
ToggleRenderer =
