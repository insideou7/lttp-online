# Keyboard controls for the browser client.
# build.sh drops these keys from upstream zelda3.ini's [KeyMap] and appends this file,
# so whatever is here wins. Key names are SDL names ("w", "Return", "Right Shift", "Up").
# After a change, update the Controls table in site/index.html too.
[KeyMap]
# Order: Up, Down, Left, Right, Select, Start, A, B, X, Y, L, R
Controls = w, s, a, d, f, g, j, m, i, l, q, e
# Backups: arrow keys still move, Right Shift / Enter still work as Select / Start
# (a second Controls line adds extra keys for the first few buttons)
Controls = Up, Down, Left, Right, Right Shift, Return

# Upstream binds cheats and debug toggles to single letters (w, o, k, l, t, f, r).
# Unbind them so they can't fire by accident or clash with the controls above.
CheatLife =
CheatKeys =
CheatEquipment =
CheatWalkThroughWalls =
ClearKeyLog =
StopReplay =
ReplayTurbo =
DisplayPerf =
ToggleRenderer =
